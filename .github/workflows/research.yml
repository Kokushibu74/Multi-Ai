name: Multi AI Research Digest

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
    inputs:
      topic:
        description: "Research topic"
        required: false
        default: "AI assistant architecture, web retrieval, security, accessibility, and performance"

permissions:
  contents: read

concurrency:
  group: research-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Restore last successful research digest
        uses: actions/cache/restore@v4
        with:
          path: .cache/research-digest.md
          key: research-digest-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            research-digest-${{ github.ref_name }}-

      - name: Fetch recent public research with retries and cached fallback
        id: digest
        env:
          TOPIC: ${{ inputs.topic || 'AI assistant architecture, web retrieval, security, accessibility, and performance' }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          topic = os.environ.get("TOPIC", "AI assistant architecture security")
          params = urllib.parse.urlencode({
              "search_query": "all:" + topic,
              "start": "0",
              "max_results": "8",
              "sortBy": "submittedDate",
              "sortOrder": "descending",
          })
          hosts = ["https://export.arxiv.org/api/query", "https://arxiv.org/api/query"]
          cache_path = Path(".cache/research-digest.md")
          output_path = Path("research-digest.md")
          cache_path.parent.mkdir(parents=True, exist_ok=True)
          errors = []

          def render_digest(xml_bytes):
              root = ET.fromstring(xml_bytes)
              ns = {"a": "http://www.w3.org/2005/Atom"}
              entries = root.findall("a:entry", ns)
              lines = [
                  "# Multi AI research digest",
                  "",
                  "Research feed is reference material only. No code is executed or deployed by this job.",
                  "",
                  "Topic: " + topic,
                  "",
              ]
              if not entries:
                  lines.append("No recent matching papers were returned.")
              for entry in entries:
                  title = " ".join(entry.findtext("a:title", default="", namespaces=ns).split())
                  summary = " ".join(entry.findtext("a:summary", default="", namespaces=ns).split())
                  link = next(
                      (item.attrib.get("href", "") for item in entry.findall("a:link", ns)
                       if item.attrib.get("rel") == "alternate"),
                      "",
                  )
                  lines.append(f"- **{title}** — {link}\n  {summary[:600]}\n")
              return "\n".join(lines).rstrip() + "\n"

          fresh = False
          for attempt in range(3):
              for host in hosts:
                  url = host + "?" + params
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "MultiAIResearchDigest/1.1", "Accept": "application/atom+xml"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          digest = render_digest(response.read())
                      output_path.write_text(digest, encoding="utf-8")
                      cache_path.write_text(digest, encoding="utf-8")
                      print(f"Fresh arXiv digest retrieved from {host} on attempt {attempt + 1}.")
                      fresh = True
                      break
                  except Exception as exc:
                      errors.append(f"{host}: {type(exc).__name__}: {exc}")
              if fresh:
                  break
              if attempt < 2:
                  delay = 3 * (2 ** attempt)
                  print(f"Both arXiv endpoints failed; retrying in {delay}s.")
                  time.sleep(delay)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("fresh=" + ("true" if fresh else "false") + "\n")

          if not fresh:
              if cache_path.exists():
                  previous = cache_path.read_text(encoding="utf-8")
                  warning = (
                      "# Multi AI research digest\n\n"
                      "> ⚠️ Live arXiv retrieval failed after bounded retries. "
                      "Showing the last successful cached digest; this is stale reference material.\n\n"
                  )
                  output_path.write_text(warning + previous, encoding="utf-8")
                  print("::warning::Live arXiv feed unavailable; restored the last successful cached digest.")
                  for error in errors[-4:]:
                      print("Retry detail: " + error[:240])
              else:
                  print("No live arXiv response and no previous cached digest is available.")
                  for error in errors[-6:]:
                      print("Retry detail: " + error[:240])
                  raise SystemExit(1)
          PY

      - name: Save fresh digest for the next fallback
        if: steps.digest.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/research-digest.md
          key: research-digest-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload research digest
        if: always() && hashFiles('research-digest.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: multi-ai-research-digest-${{ github.run_number }}
          path: research-digest.md
          retention-days: 14
