name: Multi AI Research Digest

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
    inputs:
      topic:
        description: "Research topic"
        required: false
        default: "AI assistant architecture, web retrieval, security, accessibility, and performance"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch recent public research
        env:
          TOPIC: ${{ inputs.topic || 'AI assistant architecture, web retrieval, security, accessibility, and performance' }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          topic = os.environ.get("TOPIC", "AI assistant architecture security")
          url = "https://export.arxiv.org/api/query?search_query=all:" + urllib.parse.quote(topic) + "&start=0&max_results=8&sortBy=submittedDate&sortOrder=descending"
          req = urllib.request.Request(url, headers={"User-Agent":"MultiAIResearchDigest/1.0"})
          try:
              root = ET.fromstring(urllib.request.urlopen(req, timeout=15).read())
              ns = {"a":"http://www.w3.org/2005/Atom"}
              entries = root.findall("a:entry", ns)
              print("# Multi AI research digest")
              print("\nResearch feed is reference material only. No code is executed or deployed by this job.\n")
              for entry in entries:
                  title = " ".join((entry.findtext("a:title", default="", namespaces=ns)).split())
                  summary = " ".join((entry.findtext("a:summary", default="", namespaces=ns)).split())
                  link = next((x.attrib.get("href","") for x in entry.findall("a:link",ns) if x.attrib.get("rel")=="alternate"), "")
                  print(f"- **{title}** — {link}\n  {summary[:600]}\n")
          except Exception as exc:
              print(f"Research feed unavailable: {type(exc).__name__}: {exc}")
              raise
          PY
